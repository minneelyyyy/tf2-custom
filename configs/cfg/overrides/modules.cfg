//******************************************************************************
// Networking modules
//******************************************************************************

// **Packet Rate**
// Controls how fast you send to and receive from the server.
//  CPU usage: medium
//  GPU usage: none
//  Default setting: packet_rate=standard (all presets, except Destitute)
// options:
//      congestion: A halved (33) packet rate for congested networks,
//                  usually bad Wi-Fi, or very slow CPUs.
//      standard:   The standard 66 packet rate which is the maximum for
//                  all normal servers.

packet_rate=standard


// **Snapshot Buffer**
// Controls how reliable to consider the snapshots you receive from the
//  server to apply client-side buffering/smoothing between snapshot
//  receives. Also known as linear interpolation (lerp or interp).
//  CPU usage: low
//  GPU usage: none
//  Default setting: snapshot_buffer=auto (all presets)
// options:
//      auto:   Automatically sets the best interpolation value per class.
//               For hitscan classes (Scout, Heavy, Engineer and Sniper),
//               this sets snapshot_buffer_x1. For projectile classes (Soldier,
//               Pyro, Demoman and Medic), this sets snapshot_buffer_off.
//               For Spy this sets snapshot_buffer_x1. This is the recommended setting.
//      off:    A dangerously minimal buffering time which does not have room for any
//               networking or server delays or drops (15ms lerp when using
//               packet_rate=standard, or 30ms lerp when using packet_rate=congestion).
//               There is almost no reason to use this option, except in LAN scenarios,
//               as snapshot_buffer=auto will optimize buffering for each class.
//      x1:     Safest option with minimal snapshot delay by buffering by an extra snapshot
//               (30ms lerp when using packet_rate=standard, or 60ms lerp when using
//               packet_rate=congestion).
//      x2:     Heavily protects against packet loss by buffering by 2 extra snapshots
//               (45ms lerp when using packet_rate=standard, or 90ms lerp when using
//               packet_rate=congestion).
//      custom: Prevents mastercomfig from messing with interp.
//      anim:   Adjusts the smoothing to be ideal for animations and NPCs rather than gameplay.
//               You can use this for smoother offline recordings, single-player, etc.

snapshot_buffer=auto


// **Packet Size**
// Controls how big packets are and how they are split up/compressed. It's
//  unlikely that you will ever need to change this setting.
//  CPU usage: low
//  GPU usage: none
//  Default setting: packet_size=large (all presets)
// options:
//      small:        Uses the smallest packet size that even the worst routers
//                     will process.
//      conservative: Uses a smaller, safe packet size that most routers will
//                     process.
//      large:        Uses the max recommended packet size by Steam to avoid split
//                     packets.

packet_size=large


// **Bandwidth**
// Controls the max speed of packet sending to restrict it to your internet
//  speed to prevent packet overflow. Values in bits (Kilobits or Megabits per second).
//  Note: This does not increase data usage. It only restricts how quickly
//        the game can send data.
//  CPU usage: low
//  GPU usage: none
//  Default setting: bandwidth=2.0Mbps (all presets)
// options:
//      128Kbps, 192Kbps, 384Kbps, 512Kbps, 762Kbps, 1.0Mbps,
//      1.5Mbps, 2.0Mbps, 2.5Mbps, 3.0Mbps, 4.0Mbps, 6.0Mbps

bandwidth=6.0Mbps


// **Downloads**
// Filters what custom content is allowed to be downloaded from the server.
//  CPU usage: none
//  GPU usage: none
//  Default setting: download=custom (all presets)
// options:
//      custom:    Whatever the user sets in the game settings.
//      all:       Download all custom files from servers.
//      nosounds:  Download everything but sounds from servers.
//      mapsonly:  Download only maps from servers.
//      nothing:   Do not download any custom files from servers.

download=custom



//******************************************************************************
// Graphics modules
//******************************************************************************

// **Model Quality**
// Controls how detailed models are.
//  CPU usage: low
//  GPU usage: medium
//  Default setting: based on which preset you are currently using
// options:
//      low:    Low model detail.
//      medium: Medium model detail.
//      high:   High model detail.
//      ultra:  Forces max model detail regardless of distance.

lod=low


// **Lighting**
// Controls lighting fidelity: dynamic lights, detailed lighting, light averaging,
//  lightwarps, and ambient boost.
//  CPU usage: medium
//  GPU usage: high
//  Default setting: based on which preset you are currently using
// options:
//      very_low: No dynamic lightmaps or lightmap smoothing, and skips all movable
//                 lighting. No lightwarps.
//      low:      No dynamic lightmaps, and only applies ambient movable lighting.
//                 No lightwarps.
//      medium:   No dynamic lightmaps, and applies detailed movable lighting.
//      high:     4 dynamic lightmaps, and applies detailed movable lighting.
//      ultra:    Maximum (32) dynamic lightmaps, and applies extremely detailed
//                 movable lighting.

lighting=low


// **Shading**
// Controls advanced shading commands which cause a material system reload.
//  WARNING: Using any other option than shading=high can cause visual glitches
//           in items and props. Mainly, this affects weapon War Paints and
//           Australium weapons, but can also cause maps to render incorrectly.
//  CPU usage: low
//  GPU usage: high
//  Default setting: based on which preset you are currently using
// options:
//      low:    Disables bumpmaps and specular, and uses low quality shader
//               fallbacks in some cases. Disables texture blending.
//      medium: Disables bumpmaps and specular, and uses low quality shader
//               fallbacks in some cases.
//      high:   Enables bumpmaps and specular.

shading=low


// **Phong Shading**
// Controls phong highlights for shading.
//  WARNING: Using phong=off can cause visual glitches or crashes in props on some maps.
//  CPU usage: low
//  GPU usage: high
//  Default setting: based on which preset you are currently using
// options:
//      off: Uses diffuse shading.
//      on:  Uses phong shading.
//      rim: Uses phong shading, with rimlighting.

phong=on


// **Shadows**
// Controls dynamic shadow quality. Shadow limits affect rendered shadows.
//  Shadows above the limit will be blobby.
//  CPU usage: high
//  GPU usage: medium
//  Default setting: based on which preset you are currently using
// options:
//      off:    No dynamic shadows.
//      low:    Blobby shadows.
//      medium: Up to 11 high quality shadows.
//      high:   Up to 23 high quality shadows and limited NPC shadow distance.
//      ultra:  Up to 160 ultra quality movable shadows and unlimited NPC shadow
//               distance.

shadows=off


// **Flashlight**
// Controls flashlight support. Flashlights are not used in TF2, so you should keep
//  it disabled unless you need it for a certain community server mod, like Slender,
//  or some Deathrun servers.
//  WARNING: Turning on flashlight support will cause rendering artifacts on some maps,
//           especially when Pyroland is enabled!
//  CPU usage: low
//  GPU usage: medium
//  Default setting: flashlight=off (all presets)
// options:
//      off: Disables flashlight support.
//      on:  Enables flashlight support. If the shadows module is off, this will set
//            it to the low option.

flashlight=on


// **Effects**
// Controls weapon effects, particles, and other miscellaneous effects.
//  Note: The way TF2 uses these settings is inconsistent and may not apply
//        in all cases.
//  CPU usage: medium
//  GPU usage: medium
//  Default setting: based on which preset you are currently using
// options:
//      very_low: Disables impact effects, water splash effects, weather particles,
//                 muzzle flashes, shell casing ejection, and temp ent collision.
//                 Collapses spawning particles into existing particles (including
//                 bullet tracers and flames) together, reduces particle density/quality.
//                 Disables monitors.
//      low:      Disables impact effects, water splash effects, weather particles,
//                 muzzle flashes, shell casing ejection, and temp ent collision.
//                 Reduces particle density/quality. Disables monitors.
//      medium:   Disables weather particles, muzzle flashes, and shell casing ejection.
//                 Reduces particle density/quality. Disables monitors.
//      high:     Uses full particle density/quality. 1K render resolution for monitors.
//      ultra:    Uses full particle density/quality, and forces full simulation for
//                 all particles. 1K render resolution for monitors.

effects=low

// **Tracer Effects**
// Controls bullet tracer effects.
//  CPU usage: low
//  GPU usage: low
//  Default setting: based on which preset you are currently using
// options:
//      low:    Disables first person tracers.
//      medium: Enables first person tracers.
//      high:   Enables first person tracers and makes tracers thicker.

tracers=medium


// **Water**
// Controls water reflections.
//  CPU usage: high
//  GPU usage: high
//  Default setting: based on which preset you are currently using
// options:
//      very_low: Makes water solid. 32x water render resolution.
//      low:      Uses basic water with no reflections. 128x water render resolution.
//                 Fades out to low quality solid water at short ranges.
//      medium:   Uses standard water with basic reflections. 256x water render resolution.
//                 Fades out to low quality solid water at long ranges.
//      high:     Uses standard water with all reflections. 1K water render resolution.
//                 Fades out to low quality solid water at long ranges.
//      ultra:    Uses high quality water with all reflections. 2K water render resolution.
//                 Never fades out to low quality water.

water=medium

// **General Post-Processing**
// Controls standard post-processing effects.
//  CPU usage: medium
//  GPU usage: medium
//  Default setting: based on which preset you are currently using
// options:
//      off:     No post-processing.
//      low:     Enables bloom in Valve's default style.
//      default: Enables HDR and bloom in Valve's default style.
//      calm:    Enables HDR and bloom with reduced "blow out" of bright lighting (recommended).
//      vivid:   Enables HDR and bloom with glowing highlights.
//      washed:  Enables HDR and bloom with an overall bright look.
//      dreamy:  Enables HDR and bloom with surreal dreamy look.

post_processing=off


// **Color Filter**
// Controls post-processing color filters.
//  CPU usage: none
//  GPU usage: low
//  Default setting: color_filter=off (all presets)
// options:
//      off:          No color filter.
//      grayscale:    Grayscale, no color.
//      desaturated:  Reduced saturation.
//      warm:         Warmer feeling colors.
//      cool:         Cooler feeling colors.

color_filter=off


// **Pyrovision**
// Controls Pyrovision visual effects.
//  CPU usage: none
//  GPU usage: low
//  Default setting: based on which preset you are currently using
// options:
//      low:    Disables Pyrovision vignette and skybox SSAO depth of field.
//      medium: Enables static Pyrovision vignette.
//      high:   Enables skybox SSAO depth of field and dynamic Pyrovision vignette.

pyrovision=low


// **Romevision**
// Controls Romevision visual effects. For more info, click here.
//  CPU usage: low
//  GPU usage: none
//  Default setting: romevision=off (all presets)
// options:
//      off: Disables Romevision effects.
//      on:  Enables Romevision effects.

romevision=off


// **Motion Blur**
// Controls blurring effect from rotation and movement.
//  CPU usage: low
//  GPU usage: low
//  Default setting: motion_blur=off (all presets)
// options:
//      off: Turns off motion blur.
//      low: Turns on motion blur but reduces it significantly.
//      high: Motion blur fully enabled.

motion_blur=off


// **Anti-Aliasing**
// Controls MSAA anti-aliasing.
//  WARNING: On Linux and macOS, enabling causes TF2 to do a slow full clear on AMD cards!
//  WARNING: On Linux, enabling may cause rendering errors with Wayland.
//  WARNING: On DirectX, enabling MSAA may increase input latency.
//  CPU usage: none
//  GPU usage: medium
//  Default setting: based on which preset you are currently using
// options:
//      off:      Turns off anti-aliasing.
//      msaa_2x:  Enables MSAA 2x.
//      msaa_4x:  Enables MSAA 4x.
//      msaa_8x:  Enables MSAA 8x.

anti_aliasing=off


// **Characters**
// Adjusts characters details.
//  TIP: Facial animations will only work on lod=medium and higher.
//  CPU usage: high
//  GPU usage: low
//  Default setting: based on which preset you are currently using
// options:
//      very_low: Disables facial animations, no eyes or teeth.
//      low:      Disables facial animations, enables eyes, disables teeth,
//                 disables eye movement and blinking.
//      medium:   Enables smooth facial animations, enables eyes and teeth,
//                 enables eye movement and blinking, enables enhanced lip sync
//                 at medium range.
//      high:     Enables extra smooth facial animations, enables eyes and teeth,
//                 enables eye movement and blinking, enables enhanced lip sync
//                 at any distance.

characters=low


// **General Decals**
// Controls bullet holes and overall decal support.
//  CPU usage: medium
//  GPU usage: medium
//  Default setting: based on which preset you are currently using
// options:
//      off:    Disables decals.
//      low:    9 max decals.
//      medium: 32 max decals.
//      high:   80 max decals.
//      ultra:  2048 max decals.

decals=off


// **Model Decals**
// Controls blood on hurt players and some bullet decals on props.
//  CPU usage: medium
//  GPU usage: medium
//  Default setting: based on which preset you are currently using
// options:
//      off:    Disables model decals.
//      low:    Allows up to 1 model decal.
//      medium: Allows up to 9 model decals.
//      high:   Allows up to 50 model decals.

decals_models=off


// **Map Decals**
// Controls decals placed by the map author.
//  CPU usage: none
//  GPU usage: low
//  Default setting: based on which preset you are currently using
// options:
//      off: Disables map decals.
//      on:  Enables map decals, and blocks full decal clearing done periodically.

decals_art=off


// **Spray Decals**
// Controls decals sprayed by players.
//  CPU usage: none
//  GPU usage: low
//  Default setting: sprays=off (all presets)
// options:
//      off:  Completely disables downloading, uploading and displaying sprays.
//             Deletes temporary spray files on shutdown.
//      on:   Allows sprays, and blocks full decal clearing done by mastercomfig
//             periodically. Deletes temporary spray files on shutdown.
//             If the decals module is off, this will set it to the low option.
//      keep: Allows sprays, and blocks full decal clearing done by mastercomfig
//             periodically. Keeps temporary spray files on shutdown.
//             If the decals module is off, this will set it to the low option.

sprays=off


// **Gibs**
// Controls gibs created by player explosions.
//  CPU usage: low
//  GPU usage: medium
//  Default setting: based on which preset you are currently using
// options:
//      off:  Disables gibs.
//      low:  Enables gibs.
//      high: Enables gibs, and gibs can burn.

gibs=off


// **Silly Gibs**
// Controls low violence mode.
//  CPU usage: low
//  GPU usage: low
//  Default setting: sillygibs=auto (all presets)
// options:
//      auto: Automatically chooses the best silly gibs setting for performance
//             (on if gibs are off, off if gibs are on).
//      off:  Normal gibs and blood.
//      on:   Turns on silly gibs mode. This means birthday style gibs, sparks instead
//             of blood upon flesh bullet impact, some low violence assets (like blood
//             on the Half-Zatoichi) and no blood spawned upon gibbing.

sillygibs=auto


// **Props**
// Controls the rendering of various small objects.
//  CPU usage: high
//  GPU usage: medium
//  Default setting: based on which preset you are currently using
// options:
//      low:   Disables client-side props, disables foliage.
//      high:  Enables ambient lighting and decals on static props, enables a small
//              number of client-side props, enables foliage at a reasonable distance
//              with instant pop in.
//      ultra: Enables ambient lighting and decals on static props, enables a high
//              number of client-side props, enables foliage at practically any distance.

props=low


// **Ragdolls**
// Controls physics simulation and fading for bodies that spawn on death.
//  CPU usage: high
//  GPU usage: low
//  Default setting: based on which preset you are currently using
// options:
//      off:    Disables ragdolls by fading them out quickly.
//      medium: Enables standard physics ragdolls.
//      high:   Enables ragdolls with collisions with a high fade out time, as well as
//               special animations like decapitation.

ragdolls=off


// **3D Sky**
// Controls the enhanced 3D skybox that is present in most maps.
//  WARNING: Disabling 3D sky on some AMD graphics cards in DirectX can cause flickering
//           when going underwater. Either use the -vulkan launch option, or turn on 3D sky.
//  CPU usage: medium
//  GPU usage: medium
//  Default setting: based on which preset you are currently using
// options:
//      off: Disables 3D sky.
//      on:  Enables 3D sky.

3dsky=off


// **Jigglebones**
// Controls cloth and joint physics on some items like the fish and skull bat.
//  CPU usage: low
//  GPU usage: none
//  Default setting: based on which preset you are currently using
// options:
//      off:      Always disables jigglebones.
//      on:       Disables jigglebones only if the framerate is below 67FPS.
//      force_on: Never disables jigglebones.

jigglebones=off


// **Killstreak Sheens Speed**
// Controls how fast the animation is on the killstreak sheen glow for weapons.
//  WARNING: Killstreak sheens do not work on DirectX 8.
//  CPU usage: none
//  GPU usage: none
//  Default setting: sheens_speed=slow (all presets, except Destitute)
// options:
//      off:    Skips updating sheen glow animation.
//      slow:   Slow speed.
//      medium: The standard speed.
//      fast:   Faster speed.

sheens_speed=off


// **Killstreak Sheens Tint Intensity**
// Controls how intense the color tint is on light reflections for the killstreak sheen glow.
//  Note: This module will have no effect if sheens_speed is set to off.
//  WARNING: Killstreak sheens do not work on DirectX 8.
//  CPU usage: none
//  GPU usage: none
//  Default setting: sheens_tint=high (all presets)
// options:
//      low:    Base tint.
//      medium: Small tint boost.
//      high:   High tint boost.
//      full:   Maximum tint boost.

sheens_tint=low


// **Texture Quality**
// Controls texture quality.
//  CPU usage: low
//  GPU usage: medium
//  Default setting: based on which preset you are currently using
// options:
//      low:       Low texture quality.
//      medium:    Medium texture quality.
//      high:      High texture quality.
//      very_high: Very High texture quality.
//      ultra:     Maximum texture quality.

texture_quality=low


// **Texture Filtering**
// Controls texture smoothing/filtering.
//  CPU usage: none
//  GPU usage: low
//  Default setting: based on which preset you are currently using
// options:
//      blocky:    Blocky textures and world lighting.
//      trilinear: Trilinear filtering.
//      aniso2x:   Anisotropic filtering 2x.
//      aniso4x:   Anisotropic filtering 4x.
//      aniso8x:   Anisotropic filtering 8x.
//      aniso16x:  Anisotropic filtering 16x.

texture_filter=blocky


// **Ropes**
// Controls ropes for Mannpower grappling hook and decorations in maps.
//  CPU usage: medium
//  GPU usage: low
//  Default setting: based on which preset you are currently using
// options:
//      off:   Disables ropes.
//      low:   Basic ropes.
//      high:  Ropes with smoothing and basic subdivisions.
//      ultra: Ropes with max smoothing, increased subdivisions, collision checks
//              and wind simulation.

ropes=off


// **FPS Cap**
// Controls the highest frame rate (FPS/frames per second) that the game can reach.
//  You can set it lower for faster load times, more consistent frame rate, and lower power usage.
//  Setting it higher can reduce input delay.
//  WARNING: Although it is common advice to set this based on your display's refresh rate,
//           the only thing you need to consider is having the FPS cap greater than or equal
//           to your monitor's refresh rate to get the full effect of your monitor.
//  WARNING: This module is only provided for general convenience and accessibility.
//           The built-in FPS cap in TF2 has precision problems depending on your CPU
//           (such as Intel Skylake platform and above) as well as accuracy problems on
//           Windows due to usage of millisecond timers. It is recommended you use a more
//           reliable FPS cap tool, like Rivatuner for Windows or MangoHud for Linux and
//           set fpscap=unlimited to disable the in-game FPS cap.
//  CPU usage: low
//  GPU usage: none
//  Default setting: fpscap=400 (all presets)
// options (FPS values):
//      powersaver, 30, 60, 75, 120, 144, 160, 165, 180, 200, 240, 300, 360, 400,
//      1000 (maximum safe value), unlimited

alias fpscap


// **VSync**
// Controls VSync, which removes screen tearing by syncing FPS to your monitor's refresh rate,
//  at the cost of increased input latency.
//  WARNING: If your FPS does not reach your refresh rate, it will drop to the next lowest
//           divisor (for example, 30FPS with a 60Hz monitor).
//  TIP: It's recommended to keep this off, and use NVidia Adaptive VSync, which keeps VSync
//       on only when the framerate is high enough, or NVidia Fast VSync (Enhanced Sync on AMD),
//       which drops frames which would cause tearing, while having a much lower input latency
//       compared to traditional VSync.
//  CPU usage: low
//  GPU usage: none
//  Default setting: vsync=off (all presets)
// options:
//      off: Disables VSync.
//      on:  Enables VSync.

vsync=off


//******************************************************************************
// Hud modules
//******************************************************************************

// **Player Model**
// Toggles the live 3D player model in the corner of your screen.
//  CPU usage: low
//  GPU usage: medium
//  Default setting: based on which preset you are currently using
// options:
//      off: Disables the player model.
//      on:  Enables the player model.

hud_player_model=on


// **Server Messages**
// Controls server / game mode text messages at the center of the screen.
//  CPU usage: none
//  GPU usage: none
//  Default setting: hud_server_text=on (all presets, except Destitute)
// options:
//      off: Disables server center text.
//      on:  Enables server center text.

hud_server_text=on


// **Contracts**
// Controls the Contracts HUD seen at the top right corner of the screen during gameplay.
//  CPU usage: low
//  GPU usage: none
//  Default setting: hud_contracts=custom (all presets, except Destitute)
// options:
//      custom: Whatever the user set in the game settings.
//      hide:   Hides the Contracts HUD.
//      all:    Shows all Contracts available.
//      active: Only shows active Contracts.

hud_contracts=custom


// **Panels**
// Controls health/player info panels and target ID translucency.
//  CPU usage: low
//  GPU usage: none
//  Default setting: hud_panels=high (all presets, except Low and Destitute)
// options:
//      off:  Disables health/player info panels that appear when looking at a player,
//             disables target ID box.
//      low:  Enables health/player info panels that appear when looking at a player,
//             enables opaque target ID box.
//      high: Enables health/player info panels that appear when looking at a player,
//             enables translucent target ID box.

hud_panels=high


// **Avatars**
// Controls the display of target ID avatars.
//  CPU usage: low
//  GPU usage: none
//  Default setting: based on which preset you are currently using
// options:
//      off:      Disables avatars.
//      everyone: Enables the display of everyone's avatars.
//      friends:  Enables the display of your friends' avatars.

hud_avatars=everyone


// **Match HUD**
// Toggles match status HUD at the top of the screen.
//  Note: It's highly recommended to use this module, as the built-in console variable
//        does not work properly when turning off directly.
//  CPU usage: high
//  GPU usage: none
//  Default setting: match_hud=on (all presets, except Destitute)
// options:
//      off: Disables match status HUD.
//      on:  Enables match status HUD.

match_hud=on


// **Messages**
// Controls text chat, which displays player messages and voice messages.
//  CPU usage: none
//  GPU usage: none
//  Default setting: messages=on (all presets, except Destitute)
// options:
//      off:  Disables text chat.
//      hide: Hides text chat.
//      on:   Enables text chat.

alias messages


// **Killfeed**
// Controls death and objective notifications in the top right corner.
//  CPU usage: low
//  GPU usage: none
//  Default setting: killfeed=on (all presets, except Destitute)
// options:
//      off: Disables killfeed.
//      on:  Enables killfeed.

killfeed=on


// **Killstreaks**
// Controls banners that appear at the top center of the screen, notifying you of a player's killstreak.
//  CPU usage: medium
//  GPU usage: none
//  Default setting: killstreaks=high (all presets, except Low and Destitute)
// options:
//      off:  Disables killstreak banner.
//      low:  Enables killstreak opaque banner.
//      high: Enables killstreak translucent banner.

killstreaks=low


// **HUD Achievements**
// Controls the HUD achievements tracker.
//  CPU usage: low
//  GPU usage: none
//  Default setting: hud_achievement=on (all presets, except Destitute)
// options:
//      off: Disables achievement tracker panel completely.
//      on:  Enables support for achievement tracker panel.

hud_achievement=on


// **Console**
// Controls developer console.
//  CPU usage: none
//  GPU usage: none
//  Default setting: console=on (all presets, except Destitute)
// options:
//      off: Disables developer console.
//      on:  Enables developer console.

alias console


// **HTML MOTD**
// Controls HTML MOTDs. This includes ads, music player, rules, fancy server intros, etc.
//  This module is disabled by default, since server ads can cause lag spikes.
//  CPU usage: low
//  GPU usage: low
//  Default setting: htmlmotd=off (all presets)
// options:
//      off: Disables HTML MOTDs.
//      on:  Enables HTML MOTDs.

htmlmotd=off


// **Outlines**
// Controls the outlines that appear through walls for players, some objectives
//  (payload cart, CTF briefcase), and the Scottish Resistance's stickybombs.
//  WARNING: Outlines do not work on DirectX 8.
//  CPU usage: high
//  GPU usage: high
//  Default setting: based on which preset you are currently using
// options:
//      off:    Disables nametags and all outlines.
//      low:    Enables nametags, disables all outlines.
//      medium: Disables nametags and player outlines, enables all other outlines.
//      high:   Enables nametags and player outlines for spectating only,
//               enables all other outlines.
//      ultra:  Enables nametags and all outlines.

outlines=medium


// **Map Background**
// Controls the live map that appears in the background of the main menu.
//  CPU usage: none
//  GPU usage: none
//  Default setting: dynamic_background=off (all presets)
// options:
//      off:      No main menu map background on startup.
//      dustbowl: Live Dustbowl map main menu background on startup.

dynamic_background=off


//******************************************************************************
// Sound modules
//******************************************************************************

// **Sound**
// Controls a variety of sound effects, including spatialization and positional effects.
//  CPU usage: high
//  GPU usage: none
//  Default setting: based on which preset you are currently using
// options:
//      low:       Disables sound volume mixing, very low quality sound spatialization
//                  and positional effects, delays spatialization.
//      medium:    Enables sound volume mixing, only basic sound spatialization and
//                  positional effects enabled, slightly delays spatialization.
//      high:      Enables sound volume mixing, enables all sound spatialization and
//                  positional effects, slightly delays spatialization.
//      very_high: Enables sound volume mixing, enables all sound spatialization and
//                  positional effects, immediately spatializes and traces sounds,
//                  enables pitch smoothing.
//      ultra:     Enables sound volume mixing, enables enhanced sound spatialization
//                  and positional effects, immediately spatializes and traces sounds,
//                  enables pitch smoothing.

sound=ultra


// **Voice Chat**
// Controls player voice chat.
//  CPU usage: none
//  GPU usage: none
//  Default setting: voice_chat=on (all presets, except Destitute)
// options:
//      off:    Fully disables the in-game voice chat system, does not receive audio
//               and cannot be re-enabled until reconnect.
//      hidden: Disables the in-game voice chat system by blocking audio from playing.
//      on:     Enables the in-game voice chat system.

alias voice_chat


//******************************************************************************
// Misc modules
//******************************************************************************

// **Party Join Mode**
// Controls the privacy of your Casual/Competitive matchmaking party.
//  WARNING: The Friends-Only restriction for parties can be bypassed, which means
//           anyone can join your party if they have your Steam ID. Leaving your party
//           open can result in anyone to join your party and spam party chat, causing
//           lag, sound spam and other disruptions.
//  CPU usage: none
//  GPU usage: none
//  Default setting: party_mode=invite (all presets)
// options:
//      open:    Open party (people can join anytime).
//      request: Request-only party (people can only join if you accept their request
//                or if you invite them).
//      invite:  Invite-only party (people can only join if you invite them).

alias party_mode


// **Logo**
// Controls the mastercomfig logo which appears in console on start up.
//  CPU usage: none
//  GPU usage: none
//  Default setting: logo=on (all presets, except Destitute)
// options:
//      off: Does not print logo in console on startup.
//      on:  Prints logo in console on startup.

logo=off
